tipo_desvio: SHOULDER_TILT
titulo: "Desalinhamento Lateral dos Ombros"
categoria: "Simetria de Tronco"
texto_curto: "Um dos ombros ficou mais alto ou baixo do que na postura calibrada. Relaxe os ombros e confira se a altura da cadeira e da mesa permite apoio simétrico dos antebraços."
acao_recomendada: "Relaxe ambos os ombros, evite apoiar o peso do tronco em apenas um lado e ajuste a altura da cadeira ou dos apoios para manter os braços equilibrados."
