versao_fonte: "Portaria MTP nº 4.219/2022 (20/12/2022)"
secao: "Item 17.4.3, alínea a"
pagina: 3
trecho: "17.4.3 Devem ser implementadas medidas de prevenção, a partir da avaliação ergonômica preliminar ou da AET, que evitem que os trabalhadores, ao realizar suas atividades, sejam obrigados a efetuar de forma contínua e repetitiva: a) posturas extremas ou nocivas do tronco, do pescoço, da cabeça, dos membros superiores e/ou dos membros inferiores;"
