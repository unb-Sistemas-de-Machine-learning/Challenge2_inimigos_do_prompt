titulo: "Inclinação Lateral da Cabeça"
categoria: "Alinhamento Cervical"
texto_curto: "A linha dos olhos inclinou-se lateralmente em relação à postura calibrada. Centralize o olhar na tela principal e evite manter o pescoço inclinado por longos períodos."
acao_recomendada: "Centralize o monitor à sua frente, alinhe a cabeça de forma confortável e verifique se algum objeto ou segunda tela está forçando o pescoço a ficar inclinado para um lado."
