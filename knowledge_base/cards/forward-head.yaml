id: card-forward-head-v1
tipo_desvio: FORWARD_HEAD
titulo: "Anteriorização da Cabeça"
categoria: "Desvio Cervical / Tronco"
texto_curto: "A cabeça projetou-se para a frente ou baixou em relação à postura calibrada. Ajuste a posição da tela e o apoio das costas para manter um ângulo de visão mais confortável."
acao_recomendada: "Recue o queixo suavemente, apoie as costas no encosto da cadeira e ajuste a altura ou inclinação da tela (usando suporte ou teclado externo em notebooks) para evitar olhar para baixo."
fonte_id: nr17
versao_fonte: "Portaria MTP nº 4.219/2022 (20/12/2022)"
secao: "Item 17.7.3.1"
pagina: 7
trecho: "17.7.3.1 Os equipamentos devem ter condições de mobilidade suficiente para permitir o ajuste da tela do equipamento à iluminação do ambiente, protegendo-a contra reflexos, e proporcionar corretos ângulos de visibilidade ao trabalhador."
