versao_fonte: "Portaria MTP nº 4.219/2022 (20/12/2022)"
secao: "Item 17.4.2"
pagina: 3
trecho: "17.4.2 Nas atividades que exijam sobrecarga muscular estática ou dinâmica do tronco, do pescoço, da cabeça, dos membros superiores e dos membros inferiores, devem ser adotadas medidas técnicas de engenharia, organizacionais e/ou administrativas, com o objetivo de eliminar ou reduzir essas sobrecargas, a partir da avaliação ergonômica preliminar ou da AET."
